name: Deploy FlashCart to AWS

# runs on every push to main
on:
  push:
    branches: [ "main" ]

# needed to request an oidc token for aws
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # dynamodb local for the oversell test (in-memory by default)
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node (for CDK)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go vet and test
        run: cd backend && go vet ./... && go test ./... -v

      - name: CDK tests
        run: cd infra && npm ci && npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Setup Node (for CDK)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::201298068477:role/InfraStack-GitHubDeployRoleED73FD64-UJpav1r4Z4T9
          aws-region: us-east-1

      - name: Compile Go API
        run: cd backend/cmd/api && GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap main.go

      - name: Compile Go Worker
        run: cd backend/cmd/worker && GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o bootstrap main.go

      - name: Build React Frontend
        run: cd web && npm ci && npm run build


      - name: Install CDK Dependencies
        run: cd infra && npm ci

      - name: Deploy to AWS
        run: cd infra && npx cdk deploy --require-approval never